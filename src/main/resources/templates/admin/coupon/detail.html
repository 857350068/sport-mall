<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优惠券详情 - 运动装备商城</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-2 d-none d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin}">
                                <i class="fas fa-home me-2"></i>仪表盘
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/categories}">
                                <i class="fas fa-tags me-2"></i>商品分类
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/brands}">
                                <i class="fas fa-copyright me-2"></i>品牌管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/products}">
                                <i class="fas fa-box me-2"></i>商品管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/orders}">
                                <i class="fas fa-shopping-cart me-2"></i>订单管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/admin/coupons}">
                                <i class="fas fa-ticket-alt me-2"></i>优惠券
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/promotions}">
                                <i class="fas fa-bullhorn me-2"></i>促销活动
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/users}">
                                <i class="fas fa-users me-2"></i>用户管理
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">优惠券详情</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a th:href="@{/admin/coupons/edit/{id}(id=${coupon.id})}" class="btn btn-primary me-2">
                            <i class="fas fa-edit me-1"></i>编辑优惠券
                        </a>
                        <a th:href="@{/admin/coupons}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-1"></i>返回列表
                        </a>
                    </div>
                </div>

                <!-- 成功/错误消息 -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${success}">操作成功</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${error}">操作失败</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- 优惠券基本信息 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">基本信息</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <table class="table table-borderless">
                                    <tr>
                                        <td class="fw-bold">优惠券名称:</td>
                                        <td th:text="${coupon.name}">优惠券名称</td>
                                    </tr>
                                    <tr>
                                        <td class="fw-bold">描述:</td>
                                        <td th:text="${coupon.description ?: '-'}">优惠券描述</td>
                                    </tr>
                                    <tr>
                                        <td class="fw-bold">优惠券类型:</td>
                                        <td>
                                            <span th:switch="${coupon.type}" class="badge"
                                                  th:classappend="${coupon.type == 'PERCENTAGE' ? 'bg-primary' : 'bg-success'}">
                                                <span th:case="PERCENTAGE">百分比</span>
                                                <span th:case="FIXED_AMOUNT">固定金额</span>
                                            </span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="fw-bold">折扣值:</td>
                                        <td>
                                            <span th:if="${coupon.type == 'PERCENTAGE'}" 
                                                  th:text="${#numbers.formatPercent(coupon.discountValue / 100, 1, 2)}">10%</span>
                                            <span th:if="${coupon.type == 'FIXED_AMOUNT'}">
                                                ¥<span th:text="${#numbers.formatDecimal(coupon.discountValue, 1, 2)}">10.00</span>
                                            </span>
                                        </td>
                                    </tr>
                                    <tr th:if="${coupon.minAmount > 0}">
                                        <td class="fw-bold">最低消费:</td>
                                        <td>¥<span th:text="${#numbers.formatDecimal(coupon.minAmount, 1, 2)}">100.00</span></td>
                                    </tr>
                                    <tr th:if="${coupon.maxDiscount > 0}">
                                        <td class="fw-bold">最大折扣:</td>
                                        <td>¥<span th:text="${#numbers.formatDecimal(coupon.maxDiscount, 1, 2)}">50.00</span></td>
                                    </tr>
                                </table>
                            </div>
                            <div class="col-md-6">
                                <table class="table table-borderless">
                                    <tr>
                                        <td class="fw-bold">有效期:</td>
                                        <td>
                                            <div th:text="${#temporals.format(coupon.validFrom, 'yyyy-MM-dd HH:mm')}">2023-01-01 00:00</div>
                                            <div>至</div>
                                            <div th:text="${#temporals.format(coupon.validTo, 'yyyy-MM-dd HH:mm')}">2023-12-31 23:59</div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="fw-bold">状态:</td>
                                        <td>
                                            <span th:if="${coupon.enabled}" class="badge bg-success">启用</span>
                                            <span th:unless="${coupon.enabled}" class="badge bg-secondary">禁用</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="fw-bold">总数量:</td>
                                        <td th:text="${coupon.totalCount > 0 ? coupon.totalCount : '无限量'}">100</td>
                                    </tr>
                                    <tr>
                                        <td class="fw-bold">每人限领:</td>
                                        <td th:text="${coupon.perUserLimit > 0 ? coupon.perUserLimit : '无限量'}">1</td>
                                    </tr>
                                    <tr>
                                        <td class="fw-bold">已领取/使用:</td>
                                        <td>
                                            <span th:text="${coupon.usedCount ?: 0}">0</span>/
                                            <span th:text="${coupon.totalCount > 0 ? coupon.totalCount : '无限量'}">100</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="fw-bold">创建时间:</td>
                                        <td th:text="${#temporals.format(coupon.createdAt, 'yyyy-MM-dd HH:mm')}">2023-01-01 12:00</td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-center">
                            <div class="btn-group" role="group">
                                <form th:if="${coupon.enabled}" 
                                      th:action="@{/admin/coupons/toggle/{id}(id=${coupon.id})}" 
                                      method="post">
                                    <input type="hidden" name="enabled" value="false">
                                    <button type="submit" class="btn btn-warning">
                                        <i class="fas fa-times-circle me-1"></i>禁用
                                    </button>
                                </form>
                                <form th:unless="${coupon.enabled}" 
                                      th:action="@{/admin/coupons/toggle/{id}(id=${coupon.id})}" 
                                      method="post">
                                    <input type="hidden" name="enabled" value="true">
                                    <button type="submit" class="btn btn-success">
                                        <i class="fas fa-check-circle me-1"></i>启用
                                    </button>
                                </form>
                                <form th:action="@{/admin/coupons/delete/{id}(id=${coupon.id})}" 
                                      method="post"
                                      onsubmit="return confirm('确定要删除这个优惠券吗？')">
                                    <button type="submit" class="btn btn-danger">
                                        <i class="fas fa-trash me-1"></i>删除
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
