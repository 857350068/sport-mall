<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 运动装备商城</title>
    <link href="https://cdn.jsdelivr.net.cn/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-2 d-none d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/dashboard}">
                                <i class="fas fa-tachometer-alt me-2"></i>仪表板
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/categories}">
                                <i class="fas fa-tags me-2"></i>商品分类
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/brands}">
                                <i class="fas fa-copyright me-2"></i>品牌管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/products}">
                                <i class="fas fa-box me-2"></i>商品管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/orders}">
                                <i class="fas fa-shopping-cart me-2"></i>订单管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/admin/users}">
                                <i class="fas fa-users me-2"></i>用户管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/coupons}">
                                <i class="fas fa-ticket-alt me-2"></i>优惠券
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/promotions}">
                                <i class="fas fa-bullhorn me-2"></i>促销活动
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">用户管理</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a th:href="@{/admin/users/create}" class="btn btn-primary">
                            <i class="fas fa-plus me-1"></i>新增用户
                        </a>
                    </div>
                </div>

                <!-- 成功/错误消息 -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${success}">操作成功</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${error}">操作失败</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- 搜索和筛选表单 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-search me-1"></i>搜索筛选
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/users}" method="get">
                            <div class="row">
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">用户名/邮箱/姓名</label>
                                    <input type="text" class="form-control" name="keyword" th:value="${keyword}">
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">角色</label>
                                    <select class="form-select" name="role">
                                        <option value="">全部角色</option>
                                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.description}" 
                                                th:selected="${role == r}"></option>
                                    </select>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">状态</label>
                                    <select class="form-select" name="status">
                                        <option value="">全部状态</option>
                                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.description}" 
                                                th:selected="${status == s}"></option>
                                    </select>
                                </div>
                                <div class="col-md-3 mb-3 d-flex align-items-end">
                                    <button type="submit" class="btn btn-primary me-2">
                                        <i class="fas fa-search me-1"></i>搜索
                                    </button>
                                    <a th:href="@{/admin/users}" class="btn btn-secondary">
                                        <i class="fas fa-redo me-1"></i>重置
                                    </a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 用户列表 -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>
                            <i class="fas fa-list me-1"></i>用户列表
                        </span>
                        <span class="text-muted" th:text="'共 ' + ${totalElements} + ' 条记录'"></span>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>
                                            <input type="checkbox" id="selectAll">
                                        </th>
                                        <th>ID</th>
                                        <th>用户名</th>
                                        <th>邮箱</th>
                                        <th>真实姓名</th>
                                        <th>手机号</th>
                                        <th>角色</th>
                                        <th>状态</th>
                                        <th>最后登录</th>
                                        <th>创建时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="user : ${users}">
                                        <td>
                                            <input type="checkbox" name="userIds" th:value="${user.id}">
                                        </td>
                                        <td th:text="${user.id}">1</td>
                                        <td th:text="${user.username}">username</td>
                                        <td th:text="${user.email}">email@example.com</td>
                                        <td th:text="${user.realName ?: '-'}">-</td>
                                        <td th:text="${user.phone ?: '-'}">-</td>
                                        <td>
                                            <span class="badge" th:classappend="${user.role == T(com.sportmall.enums.UserRole).ADMIN ? 'bg-danger' : 'bg-primary'}" 
                                                  th:text="${user.role.description}">管理员</span>
                                        </td>
                                        <td>
                                            <span class="badge" th:classappend="${user.status == T(com.sportmall.enums.UserStatus).ACTIVE ? 'bg-success' : 'bg-secondary'}" 
                                                  th:text="${user.status.description}">启用</span>
                                        </td>
                                        <td th:text="${#temporals.format(user.lastLoginTime, 'yyyy-MM-dd HH:mm') ?: '-'}">-</td>
                                        <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2023-01-01 12:00</td>
                                        <td>
                                            <div class="btn-group btn-group-sm" role="group">
                                                <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn btn-outline-primary">
                                                    <i class="fas fa-edit"></i>
                                                </a>
                                                <button type="button" class="btn btn-outline-danger" 
                                                        th:onclick="deleteUser([[${user.id}]])">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- 批量操作 -->
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div>
                                <button type="button" class="btn btn-danger btn-sm" id="batchDelete">
                                    <i class="fas fa-trash me-1"></i>批量删除
                                </button>
                            </div>
                            
                            <!-- 分页 -->
                            <nav th:if="${totalPages > 1}">
                                <ul class="pagination pagination-sm mb-0">
                                    <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                                        <a class="page-link" th:href="@{/admin/users(page=${currentPage - 1}, size=10, role=${role}, status=${status}, keyword=${keyword})}">
                                            上一页
                                        </a>
                                    </li>
                                    
                                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
                                        th:classappend="${i == currentPage ? 'active' : ''}">
                                        <a class="page-link" th:href="@{/admin/users(page=${i}, size=10, role=${role}, status=${status}, keyword=${keyword})}" 
                                           th:text="${i + 1}">1</a>
                                    </li>
                                    
                                    <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                                        <a class="page-link" th:href="@{/admin/users(page=${currentPage + 1}, size=10, role=${role}, status=${status}, keyword=${keyword})}">
                                            下一页
                                        </a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net.cn/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // 全选/取消全选
        document.getElementById('selectAll').addEventListener('change', function() {
            const checkboxes = document.querySelectorAll('input[name="userIds"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = this.checked;
            });
        });

        // 批量删除
        document.getElementById('batchDelete').addEventListener('click', function() {
            const selectedIds = Array.from(document.querySelectorAll('input[name="userIds"]:checked'))
                                    .map(checkbox => checkbox.value);
            
            if (selectedIds.length === 0) {
                alert('请至少选择一个用户');
                return;
            }
            
            if (confirm('确定要删除选中的用户吗？')) {
                // 创建表单并提交
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/admin/users/batch/delete';
                
                // 添加CSRF令牌（如果需要）
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
                
                if (csrfToken && csrfHeader) {
                    const csrfInput = document.createElement('input');
                    csrfInput.type = 'hidden';
                    csrfInput.name = csrfHeader;
                    csrfInput.value = csrfToken;
                    form.appendChild(csrfInput);
                }
                
                // 添加选中的ID
                selectedIds.forEach(id => {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'ids';
                    input.value = id;
                    form.appendChild(input);
                });
                
                document.body.appendChild(form);
                form.submit();
            }
        });

        // 删除单个用户
        function deleteUser(userId) {
            if (confirm('确定要删除这个用户吗？')) {
                // 创建表单并提交
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/admin/users/delete/' + userId;
                
                // 添加CSRF令牌（如果需要）
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
                
                if (csrfToken && csrfHeader) {
                    const csrfInput = document.createElement('input');
                    csrfInput.type = 'hidden';
                    csrfInput.name = csrfHeader;
                    csrfInput.value = csrfToken;
                    form.appendChild(csrfInput);
                }
                
                document.body.appendChild(form);
                form.submit();
            }
        }
    </script>
</body>
</html>
