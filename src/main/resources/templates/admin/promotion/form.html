<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑促销活动 - 管理后台</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-2 d-none d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="/admin">
                                <i class="fas fa-home me-2"></i>首页
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/users">
                                <i class="fas fa-users me-2"></i>用户管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/categories">
                                <i class="fas fa-tags me-2"></i>分类管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/brands">
                                <i class="fas fa-building me-2"></i>品牌管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/products">
                                <i class="fas fa-box me-2"></i>商品管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/orders">
                                <i class="fas fa-shopping-bag me-2"></i>订单管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="/admin/promotions">
                                <i class="fas fa-bullhorn me-2"></i>促销活动
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/coupons">
                                <i class="fas fa-ticket-alt me-2"></i>优惠券
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <!-- 顶部导航 -->
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">编辑促销活动</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <a href="/admin/promotions" class="btn btn-sm btn-outline-secondary">
                                <i class="fas fa-arrow-left me-1"></i>返回列表
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 编辑表单 -->
                <div class="card">
                    <div class="card-body">
                        <form>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">活动名称 <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="name" value="春节大促" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="status" class="form-label">状态 <span class="text-danger">*</span></label>
                                        <select class="form-select" id="status" required>
                                            <option value="ACTIVE" selected>进行中</option>
                                            <option value="INACTIVE">未开始</option>
                                            <option value="ENDED">已结束</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">活动描述</label>
                                <textarea class="form-control" id="description" rows="3">春节期间全场商品优惠活动</textarea>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="type" class="form-label">活动类型 <span class="text-danger">*</span></label>
                                        <select class="form-select" id="type" required>
                                            <option value="DISCOUNT" selected>折扣</option>
                                            <option value="FIXED_AMOUNT">固定金额抵扣</option>
                                            <option value="BUY_X_GET_Y">买X送Y</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="value" class="form-label">折扣率 <span class="text-danger">*</span></label>
                                        <input type="number" class="form-control" id="value" value="0.8" step="0.01" min="0" required>
                                        <div class="form-text">折扣类型：0.8表示8折；固定金额：抵扣金额；买X送Y：买几送几</div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="minPurchase" class="form-label">最低消费金额</label>
                                        <input type="number" class="form-control" id="minPurchase" value="100" min="0">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="maxDiscount" class="form-label">最大优惠金额</label>
                                        <input type="number" class="form-control" id="maxDiscount" min="0">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="startTime" class="form-label">开始时间 <span class="text-danger">*</span></label>
                                        <input type="datetime-local" class="form-control" id="startTime" value="2024-02-10T00:00" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="endTime" class="form-label">结束时间 <span class="text-danger">*</span></label>
                                        <input type="datetime-local" class="form-control" id="endTime" value="2024-02-20T23:59" required>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">参与商品</label>
                                <div class="border rounded p-3">
                                    <div class="d-flex justify-content-between mb-3">
                                        <div>
                                            <button type="button" class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#productModal">
                                                <i class="fas fa-plus me-1"></i>添加商品
                                            </button>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="selectAll">
                                            <label class="form-check-label" for="selectAll">全选</label>
                                        </div>
                                    </div>
                                    
                                    <div class="table-responsive">
                                        <table class="table table-striped table-hover">
                                            <thead>
                                                <tr>
                                                    <th width="50">
                                                        <input type="checkbox" id="selectAllProducts">
                                                    </th>
                                                    <th>商品名称</th>
                                                    <th>分类</th>
                                                    <th>品牌</th>
                                                    <th>原价</th>
                                                    <th>操作</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr>
                                                    <td>
                                                        <input type="checkbox" checked>
                                                    </td>
                                                    <td>专业跑鞋</td>
                                                    <td>跑步装备</td>
                                                    <td>Nike</td>
                                                    <td>¥299</td>
                                                    <td>
                                                        <button type="button" class="btn btn-sm btn-outline-danger">
                                                            <i class="fas fa-trash"></i>
                                                        </button>
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td>
                                                        <input type="checkbox" checked>
                                                    </td>
                                                    <td>运动T恤</td>
                                                    <td>跑步装备</td>
                                                    <td>Adidas</td>
                                                    <td>¥89</td>
                                                    <td>
                                                        <button type="button" class="btn btn-sm btn-outline-danger">
                                                            <i class="fas fa-trash"></i>
                                                        </button>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-end gap-2">
                                <a href="/admin/promotions" class="btn btn-secondary">取消</a>
                                <button type="submit" class="btn btn-primary">保存</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 商品选择模态框 -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">选择商品</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="搜索商品名称">
                            <button class="btn btn-outline-secondary" type="button">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th width="50">
                                        <input type="checkbox" id="selectAllModal">
                                    </th>
                                    <th>商品名称</th>
                                    <th>分类</th>
                                    <th>品牌</th>
                                    <th>价格</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>
                                        <input type="checkbox">
                                    </td>
                                    <td>健身哑铃</td>
                                    <td>健身器材</td>
                                    <td>Under Armour</td>
                                    <td>¥159</td>
                                </tr>
                                <tr>
                                    <td>
                                        <input type="checkbox">
                                    </td>
                                    <td>运动水杯</td>
                                    <td>跑步装备</td>
                                    <td>Nike</td>
                                    <td>¥39</td>
                                </tr>
                                <tr>
                                    <td>
                                        <input type="checkbox">
                                    </td>
                                    <td>瑜伽垫</td>
                                    <td>健身器材</td>
                                    <td>Adidas</td>
                                    <td>¥69</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">添加选中商品</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script>
        // 全选功能
        document.getElementById('selectAll').addEventListener('change', function() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = this.checked;
            });
        });
    </script>
</body>
</html>
