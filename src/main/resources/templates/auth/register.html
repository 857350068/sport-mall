<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 运动装备商城</title>
    <link href="https://cdn.jsdelivr.net.cn/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .register-container {
            max-width: 500px;
            margin: 2rem auto;
        }
        
        .register-card {
            border-radius: 10px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        
        .register-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px 10px 0 0;
        }
    </style>
</head>
<body class="bg-light">
    <div class="register-container">
        <div class="card register-card">
            <div class="card-header text-center register-header">
                <h3 class="mb-0">运动装备商城</h3>
                <p class="mb-0">用户注册</p>
            </div>
            
            <div class="card-body">
                <!-- 错误消息 -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${error}">注册失败</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <!-- 成功消息 -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${success}">注册成功</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <!-- 注册表单 -->
                <form th:action="@{/register}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="form-text">用户名长度为4-20个字符</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">邮箱</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">密码</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="form-text">密码长度至少6个字符</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">确认密码</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                        </div>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="agreement" required>
                        <label class="form-check-label" for="agreement">
                            我已阅读并同意 <a href="#" class="text-decoration-none">用户协议</a> 和 <a href="#" class="text-decoration-none">隐私政策</a>
                        </label>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">注册</button>
                    </div>
                </form>
                
                <hr>
                
                <div class="text-center">
                    <p class="mb-2">已有账号？</p>
                    <a href="/login" class="btn btn-outline-primary">立即登录</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net.cn/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        // 页面加载完成后添加表单验证和反馈功能
        document.addEventListener('DOMContentLoaded', function() {
            // 注册表单提交事件
            const registerForm = document.querySelector('form');
            if (registerForm) {
                registerForm.addEventListener('submit', function(e) {
                    const username = document.getElementById('username').value;
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;
                    const agreement = document.getElementById('agreement').checked;
                    
                    // 验证表单
                    if (!username || !email || !password || !confirmPassword) {
                        e.preventDefault();
                        showErrorMessage('请填写所有必填字段');
                        return false;
                    }
                    
                    if (password !== confirmPassword) {
                        e.preventDefault();
                        showErrorMessage('两次输入的密码不一致');
                        return false;
                    }
                    
                    if (password.length < 6) {
                        e.preventDefault();
                        showErrorMessage('密码长度至少6个字符');
                        return false;
                    }
                    
                    if (username.length < 4 || username.length > 20) {
                        e.preventDefault();
                        showErrorMessage('用户名长度为4-20个字符');
                        return false;
                    }
                    
                    if (!agreement) {
                        e.preventDefault();
                        showErrorMessage('请同意用户协议和隐私政策');
                        return false;
                    }
                    
                    // 显示加载状态
                    const submitButton = this.querySelector('button[type="submit"]');
                    const originalText = submitButton.innerHTML;
                    submitButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 注册中...';
                    submitButton.disabled = true;
                });
            }
            
            // 显示错误消息
            function showErrorMessage(message) {
                showMessage(message, 'danger');
            }
            
            // 显示成功消息
            function showSuccessMessage(message) {
                showMessage(message, 'success');
            }
            
            // 显示消息
            function showMessage(message, type) {
                // 移除已存在的消息
                const existingAlert = document.querySelector('.alert');
                if (existingAlert && !existingAlert.classList.contains('alert-dismissible')) {
                    existingAlert.remove();
                }
                
                // 创建新的消息元素
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
                alertDiv.style = 'top: 20px; right: 20px; z-index: 9999;';
                alertDiv.role = 'alert';
                alertDiv.innerHTML = `
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                `;
                
                // 添加到页面
                document.body.appendChild(alertDiv);
                
                // 3秒后自动消失
                setTimeout(function() {
                    if (alertDiv.parentNode) {
                        alertDiv.parentNode.removeChild(alertDiv);
                    }
                }, 3000);
            }
        });
    </script>
</body>
</html>
