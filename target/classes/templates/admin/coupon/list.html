<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优惠券管理 - 运动装备商城</title>
    <link href="https://cdn.jsdelivr.net.cn/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-2 d-none d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin}">
                                <i class="fas fa-home me-2"></i>仪表板
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/categories}">
                                <i class="fas fa-tags me-2"></i>商品分类
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/brands}">
                                <i class="fas fa-copyright me-2"></i>品牌管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/products}">
                                <i class="fas fa-box me-2"></i>商品管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/orders}">
                                <i class="fas fa-shopping-cart me-2"></i>订单管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/admin/coupons}">
                                <i class="fas fa-ticket-alt me-2"></i>优惠券
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/promotions}">
                                <i class="fas fa-bullhorn me-2"></i>促销活动
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/users}">
                                <i class="fas fa-users me-2"></i>用户管理
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">优惠券管理</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a th:href="@{/admin/coupons/create}" class="btn btn-primary">
                            <i class="fas fa-plus me-1"></i>新增优惠券
                        </a>
                    </div>
                </div>

                <!-- 成功/错误消息 -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${success}">操作成功</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${error}">操作失败</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- 搜索和筛选表单 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">搜索筛选</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/coupons}" method="get" class="row g-3">
                            <div class="col-md-4">
                                <label for="type" class="form-label">优惠券类型</label>
                                <select class="form-select" id="type" name="type">
                                    <option value="">全部类型</option>
                                    <option th:each="typeOption : ${types}" 
                                            th:value="${typeOption}" 
                                            th:text="${typeOption.description}"
                                            th:selected="${type != null and type == typeOption}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="enabled" class="form-label">状态</label>
                                <select class="form-select" id="enabled" name="enabled">
                                    <option value="">全部状态</option>
                                    <option value="true" th:selected="${enabled == true}">启用</option>
                                    <option value="false" th:selected="${enabled == false}">禁用</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">&nbsp;</label>
                                <div>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-search me-1"></i>搜索
                                    </button>
                                    <a th:href="@{/admin/coupons}" class="btn btn-secondary">重置</a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 优惠券列表 -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">优惠券列表</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>名称</th>
                                        <th>类型</th>
                                        <th>折扣值</th>
                                        <th>最低消费</th>
                                        <th>有效期</th>
                                        <th>状态</th>
                                        <th>已领取/总数</th>
                                        <th>创建时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="coupon : ${coupons}">
                                        <td>
                                            <div th:text="${coupon.name}">优惠券名称</div>
                                            <small class="text-muted" th:text="${coupon.description ?: '-'}">描述</small>
                                        </td>
                                        <td>
                                            <span th:switch="${coupon.type}" class="badge"
                                                  th:classappend="${coupon.type == 'PERCENTAGE' ? 'bg-primary' : 'bg-success'}">
                                                <span th:case="PERCENTAGE">百分比</span>
                                                <span th:case="FIXED_AMOUNT">固定金额</span>
                                            </span>
                                        </td>
                                        <td>
                                            <span th:if="${coupon.type == 'PERCENTAGE'}" 
                                                  th:text="${#numbers.formatPercent(coupon.discountValue / 100, 1, 2)}">10%</span>
                                            <span th:if="${coupon.type == 'FIXED_AMOUNT'}">
                                                ¥<span th:text="${#numbers.formatDecimal(coupon.discountValue, 1, 2)}">10.00</span>
                                            </span>
                                        </td>
                                        <td>
                                            <span th:if="${coupon.minAmount > 0}">
                                                满¥<span th:text="${#numbers.formatDecimal(coupon.minAmount, 1, 2)}">100.00</span>
                                            </span>
                                            <span th:unless="${coupon.minAmount > 0}">无限制</span>
                                        </td>
                                        <td>
                                            <div th:text="${#temporals.format(coupon.validFrom, 'yyyy-MM-dd')}">2023-01-01</div>
                                            <div th:text="${#temporals.format(coupon.validTo, 'yyyy-MM-dd')}">2023-12-31</div>
                                        </td>
                                        <td>
                                            <span th:if="${coupon.enabled}" class="badge bg-success">启用</span>
                                            <span th:unless="${coupon.enabled}" class="badge bg-secondary">禁用</span>
                                        </td>
                                        <td>
                                            <span th:text="${coupon.usedCount ?: 0}">0</span>/
                                            <span th:text="${coupon.totalCount ?: '无限制'}">100</span>
                                        </td>
                                        <td th:text="${#temporals.format(coupon.createdAt, 'yyyy-MM-dd HH:mm')}">2023-01-01 12:00</td>
                                        <td>
                                            <div class="btn-group btn-group-sm" role="group">
                                                <a th:href="@{/admin/coupons/{id}(id=${coupon.id})}" 
                                                   class="btn btn-outline-info">
                                                    <i class="fas fa-eye"></i> 查看
                                                </a>
                                                <a th:href="@{/admin/coupons/edit/{id}(id=${coupon.id})}" 
                                                   class="btn btn-outline-primary">
                                                    <i class="fas fa-edit"></i> 编辑
                                                </a>
                                                <div class="btn-group" role="group">
                                                    <button type="button" class="btn btn-outline-secondary dropdown-toggle" 
                                                            data-bs-toggle="dropdown">
                                                        操作
                                                    </button>
                                                    <ul class="dropdown-menu">
                                                        <li th:if="${coupon.enabled}">
                                                            <form th:action="@{/admin/coupons/toggle/{id}(id=${coupon.id})}" 
                                                                  method="post">
                                                                <input type="hidden" name="enabled" value="false">
                                                                <button type="submit" class="dropdown-item">
                                                                    <i class="fas fa-times-circle text-warning me-1"></i>禁用
                                                                </button>
                                                            </form>
                                                        </li>
                                                        <li th:unless="${coupon.enabled}">
                                                            <form th:action="@{/admin/coupons/toggle/{id}(id=${coupon.id})}" 
                                                                  method="post">
                                                                <input type="hidden" name="enabled" value="true">
                                                                <button type="submit" class="dropdown-item">
                                                                    <i class="fas fa-check-circle text-success me-1"></i>启用
                                                                </button>
                                                            </form>
                                                        </li>
                                                        <li>
                                                            <form th:action="@{/admin/coupons/delete/{id}(id=${coupon.id})}" 
                                                                  method="post"
                                                                  onsubmit="return confirm('确定要删除这个优惠券吗？')">
                                                                <button type="submit" class="dropdown-item text-danger">
                                                                    <i class="fas fa-trash me-1"></i>删除
                                                                </button>
                                                            </form>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- 分页 -->
                        <nav th:if="${totalPages > 1}">
                            <ul class="pagination justify-content-center mb-0">
                                <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                                    <a class="page-link" 
                                       th:href="@{/admin/coupons(page=${currentPage - 1}, size=10, type=${type}, enabled=${enabled})}">
                                        上一页
                                    </a>
                                </li>
                                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                    th:classappend="${i == currentPage ? 'active' : ''}">
                                    <a class="page-link" 
                                       th:href="@{/admin/coupons(page=${i}, size=10, type=${type}, enabled=${enabled})}"
                                       th:text="${i + 1}">1</a>
                                </li>
                                <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                                    <a class="page-link" 
                                       th:href="@{/admin/coupons(page=${currentPage + 1}, size=10, type=${type}, enabled=${enabled})}">
                                        下一页
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net.cn/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
