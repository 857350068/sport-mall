<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑用户 - 运动装备商城</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-2 d-none d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/dashboard}">
                                <i class="fas fa-tachometer-alt me-2"></i>仪表板
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/categories}">
                                <i class="fas fa-tags me-2"></i>商品分类
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/brands}">
                                <i class="fas fa-copyright me-2"></i>品牌管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/products}">
                                <i class="fas fa-box me-2"></i>商品管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/orders}">
                                <i class="fas fa-shopping-cart me-2"></i>订单管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/admin/users}">
                                <i class="fas fa-users me-2"></i>用户管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/coupons}">
                                <i class="fas fa-ticket-alt me-2"></i>优惠券
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/promotions}">
                                <i class="fas fa-bullhorn me-2"></i>促销活动
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2" th:text="${user.id != null ? '编辑用户' : '新增用户'}">编辑用户</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a th:href="@{/admin/users}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-1"></i>返回列表
                        </a>
                    </div>
                </div>

                <!-- 成功/错误消息 -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${success}">操作成功</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${error}">操作失败</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- 用户表单 -->
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-user me-1"></i>用户信息
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/users/save}" method="post" th:object="${user}">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">用户名 *</label>
                                    <input type="text" class="form-control" th:field="*{username}" 
                                           th:readonly="${user.id != null}" required>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">邮箱 *</label>
                                    <input type="email" class="form-control" th:field="*{email}" required>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">真实姓名</label>
                                    <input type="text" class="form-control" th:field="*{realName}">
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">手机号</label>
                                    <input type="text" class="form-control" th:field="*{phone}">
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">角色</label>
                                    <select class="form-select" th:field="*{role}">
                                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.description}"></option>
                                    </select>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">状态</label>
                                    <select class="form-select" th:field="*{status}">
                                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.description}"></option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i>保存
                                </button>
                                <a th:href="@{/admin/users}" class="btn btn-secondary ms-2">
                                    <i class="fas fa-times me-1"></i>取消
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
