<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - 运动装备商城</title>
    <link href="https://cdn.jsdelivr.net.cn/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <nav class="col-md-2 d-none d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin}">
                                <i class="fas fa-home me-2"></i>仪表板
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/categories}">
                                <i class="fas fa-tags me-2"></i>商品分类
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/brands}">
                                <i class="fas fa-copyright me-2"></i>品牌管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/products}">
                                <i class="fas fa-box me-2"></i>商品管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/admin/orders}">
                                <i class="fas fa-shopping-cart me-2"></i>订单管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/coupons}">
                                <i class="fas fa-ticket-alt me-2"></i>优惠券
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/promotions}">
                                <i class="fas fa-bullhorn me-2"></i>促销活动
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/users}">
                                <i class="fas fa-users me-2"></i>用户管理
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- 主内容区 -->
            <main class="col-md-10 ms-sm-auto px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">订单管理</h1>
                </div>

                <!-- 成功/错误消息 -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${success}">操作成功</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${error}">操作失败</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- 搜索和筛选表单 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">搜索筛选</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/orders}" method="get" class="row g-3">
                            <div class="col-md-3">
                                <label for="orderNo" class="form-label">订单号</label>
                                <input type="text" class="form-control" id="orderNo" name="orderNo" 
                                       th:value="${orderNo}">
                            </div>
                            <div class="col-md-3">
                                <label for="status" class="form-label">订单状态</label>
                                <select class="form-select" id="status" name="status">
                                    <option value="">全部状态</option>
                                    <option th:each="statusOption : ${statuses}" 
                                            th:value="${statusOption}" 
                                            th:text="${statusOption.description}"
                                            th:selected="${status != null and status == statusOption}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="userId" class="form-label">用户ID</label>
                                <input type="number" class="form-control" id="userId" name="userId" 
                                       th:value="${userId}">
                            </div>
                            <div class="col-md-3">
                                <label for="startDate" class="form-label">开始日期</label>
                                <input type="date" class="form-control" id="startDate" name="startDate" 
                                       th:value="${startDate}">
                            </div>
                            <div class="col-md-3">
                                <label for="endDate" class="form-label">结束日期</label>
                                <input type="date" class="form-control" id="endDate" name="endDate" 
                                       th:value="${endDate}">
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-search me-1"></i>搜索
                                </button>
                                <a th:href="@{/admin/orders}" class="btn btn-secondary">重置</a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 订单列表 -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">订单列表</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>
                                            <input type="checkbox" id="selectAll">
                                        </th>
                                        <th>订单号</th>
                                        <th>用户</th>
                                        <th>商品信息</th>
                                        <th>总金额</th>
                                        <th>实际金额</th>
                                        <th>状态</th>
                                        <th>创建时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="order : ${orders}">
                                        <td>
                                            <input type="checkbox" name="orderIds" th:value="${order.id}">
                                        </td>
                                        <td th:text="${order.orderNo}">ORD20230101001</td>
                                        <td>
                                            <div th:text="${order.user?.username ?: '未知用户'}">用户名</div>
                                            <small class="text-muted" th:text="${order.receiverName}">收货人</small>
                                        </td>
                                        <td>
                                            <div th:text="${order.productName}">商品名称</div>
                                            <small class="text-muted">数量: <span th:text="${order.quantity}">1</span></small>
                                        </td>
                                        <td>
                                            <span class="text-muted text-decoration-line-through">¥</span>
                                            <span class="text-muted text-decoration-line-through" th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">100.00</span>
                                        </td>
                                        <td>
                                            <span class="fw-bold text-primary">¥</span>
                                            <span class="fw-bold text-primary" th:text="${#numbers.formatDecimal(order.actualAmount, 1, 2)}">90.00</span>
                                        </td>
                                        <td>
                                            <span th:switch="${order.status}" class="badge"
                                                  th:classappend="${order.status == 'PENDING' ? 'bg-warning' : 
                                                                  order.status == 'PAID' ? 'bg-info' : 
                                                                  order.status == 'SHIPPED' ? 'bg-primary' : 
                                                                  order.status == 'COMPLETED' ? 'bg-success' : 'bg-danger'}">
                                                <span th:case="PENDING">待支付</span>
                                                <span th:case="PAID">已支付</span>
                                                <span th:case="SHIPPED">已发货</span>
                                                <span th:case="COMPLETED">已完成</span>
                                                <span th:case="CANCELLED">已取消</span>
                                            </span>
                                        </td>
                                        <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">2023-01-01 12:00</td>
                                        <td>
                                            <div class="btn-group btn-group-sm" role="group">
                                                <a th:href="@{/admin/orders/{id}(id=${order.id})}" 
                                                   class="btn btn-outline-info">
                                                    <i class="fas fa-eye"></i> 查看
                                                </a>
                                                <div class="btn-group" role="group">
                                                    <button type="button" class="btn btn-outline-secondary dropdown-toggle" 
                                                            data-bs-toggle="dropdown">
                                                        操作
                                                    </button>
                                                    <ul class="dropdown-menu">
                                                        <li th:if="${order.status == 'PAID'}">
                                                            <form th:action="@{/admin/orders/ship/{id}(id=${order.id})}" 
                                                                  method="post">
                                                                <button type="submit" class="dropdown-item">
                                                                    <i class="fas fa-truck me-1"></i>发货
                                                                </button>
                                                            </form>
                                                        </li>
                                                        <li th:if="${order.status == 'SHIPPED'}">
                                                            <form th:action="@{/admin/orders/complete/{id}(id=${order.id})}" 
                                                                  method="post">
                                                                <button type="submit" class="dropdown-item">
                                                                    <i class="fas fa-check-circle me-1"></i>完成
                                                                </button>
                                                            </form>
                                                        </li>
                                                        <li th:if="${order.status == 'PENDING' or order.status == 'PAID'}">
                                                            <button type="button" class="dropdown-item text-danger" 
                                                                    th:onclick="|showCancelModal('${order.id}')|">
                                                                <i class="fas fa-times-circle me-1"></i>取消
                                                            </button>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- 批量操作 -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div>
                                <button type="button" class="btn btn-outline-primary btn-sm" id="batchShip">
                                    <i class="fas fa-truck me-1"></i>批量发货
                                </button>
                                <button type="button" class="btn btn-outline-success btn-sm ms-2" id="batchComplete">
                                    <i class="fas fa-check-circle me-1"></i>批量完成
                                </button>
                                <button type="button" class="btn btn-outline-danger btn-sm ms-2" id="batchCancel">
                                    <i class="fas fa-times-circle me-1"></i>批量取消
                                </button>
                            </div>
                            
                            <!-- 分页 -->
                            <nav th:if="${totalPages > 1}">
                                <ul class="pagination mb-0">
                                    <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                                        <a class="page-link" 
                                           th:href="@{/admin/orders(page=${currentPage - 1}, size=10, 
                                                                      orderNo=${orderNo}, status=${status}, 
                                                                      userId=${userId}, startDate=${startDate}, 
                                                                      endDate=${endDate})}">
                                            上一页
                                        </a>
                                    </li>
                                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                        th:classappend="${i == currentPage ? 'active' : ''}">
                                        <a class="page-link" 
                                           th:href="@{/admin/orders(page=${i}, size=10, 
                                                                      orderNo=${orderNo}, status=${status}, 
                                                                      userId=${userId}, startDate=${startDate}, 
                                                                      endDate=${endDate})}"
                                           th:text="${i + 1}">1</a>
                                    </li>
                                    <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                                        <a class="page-link" 
                                           th:href="@{/admin/orders(page=${currentPage + 1}, size=10, 
                                                                      orderNo=${orderNo}, status=${status}, 
                                                                      userId=${userId}, startDate=${startDate}, 
                                                                      endDate=${endDate})}">
                                            下一页
                                        </a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 取消订单模态框 -->
    <div class="modal fade" id="cancelModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">取消订单</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="cancelForm">
                        <input type="hidden" id="cancelOrderId">
                        <div class="mb-3">
                            <label for="cancelReason" class="form-label">取消原因</label>
                            <textarea class="form-control" id="cancelReason" rows="3" required>用户取消</textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-danger" onclick="cancelOrder()">确认取消</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net.cn/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        // 全选/取消全选
        document.getElementById('selectAll').addEventListener('change', function() {
            const checkboxes = document.querySelectorAll('input[name="orderIds"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = this.checked;
            });
        });

        // 显示取消订单模态框
        function showCancelModal(orderId) {
            document.getElementById('cancelOrderId').value = orderId;
            const modal = new bootstrap.Modal(document.getElementById('cancelModal'));
            modal.show();
        }

        // 取消订单
        function cancelOrder() {
            const orderId = document.getElementById('cancelOrderId').value;
            const reason = document.getElementById('cancelReason').value;

            // 创建表单并提交
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/admin/orders/cancel/' + orderId;
            
            // 添加取消原因
            const reasonInput = document.createElement('input');
            reasonInput.type = 'hidden';
            reasonInput.name = 'reason';
            reasonInput.value = reason;
            form.appendChild(reasonInput);
            
            // 添加CSRF令牌（如果需要）
            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
            if (csrfToken) {
                const csrfInput = document.createElement('input');
                csrfInput.type = 'hidden';
                csrfInput.name = '_csrf';
                csrfInput.value = csrfToken;
                form.appendChild(csrfInput);
            }
            
            document.body.appendChild(form);
            form.submit();
        }

        // 批量发货
        document.getElementById('batchShip').addEventListener('click', function() {
            const selectedIds = Array.from(document.querySelectorAll('input[name="orderIds"]:checked'))
                                    .map(checkbox => checkbox.value);
            
            if (selectedIds.length === 0) {
                alert('请至少选择一个订单');
                return;
            }

            if (confirm('确定要发货选中的订单吗？')) {
                // 创建表单并提交
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/admin/orders/batch/ship';
                
                // 添加CSRF令牌（如果需要）
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                if (csrfToken) {
                    const csrfInput = document.createElement('input');
                    csrfInput.type = 'hidden';
                    csrfInput.name = '_csrf';
                    csrfInput.value = csrfToken;
                    form.appendChild(csrfInput);
                }
                
                // 添加选中的ID
                selectedIds.forEach(id => {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'ids';
                    input.value = id;
                    form.appendChild(input);
                });
                
                document.body.appendChild(form);
                form.submit();
            }
        });

        // 批量完成
        document.getElementById('batchComplete').addEventListener('click', function() {
            const selectedIds = Array.from(document.querySelectorAll('input[name="orderIds"]:checked'))
                                    .map(checkbox => checkbox.value);
            
            if (selectedIds.length === 0) {
                alert('请至少选择一个订单');
                return;
            }

            if (confirm('确定要完成选中的订单吗？')) {
                // 创建表单并提交
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/admin/orders/batch/complete';
                
                // 添加CSRF令牌（如果需要）
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                if (csrfToken) {
                    const csrfInput = document.createElement('input');
                    csrfInput.type = 'hidden';
                    csrfInput.name = '_csrf';
                    csrfInput.value = csrfToken;
                    form.appendChild(csrfInput);
                }
                
                // 添加选中的ID
                selectedIds.forEach(id => {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'ids';
                    input.value = id;
                    form.appendChild(input);
                });
                
                document.body.appendChild(form);
                form.submit();
            }
        });

        // 批量取消
        document.getElementById('batchCancel').addEventListener('click', function() {
            const selectedIds = Array.from(document.querySelectorAll('input[name="orderIds"]:checked'))
                                    .map(checkbox => checkbox.value);
            
            if (selectedIds.length === 0) {
                alert('请至少选择一个订单');
                return;
            }

            // 显示取消原因输入框
            const reason = prompt('请输入取消原因：', '批量取消');
            if (reason !== null) {
                // 创建表单并提交
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/admin/orders/batch/cancel';
                
                // 添加取消原因
                const reasonInput = document.createElement('input');
                reasonInput.type = 'hidden';
                reasonInput.name = 'reason';
                reasonInput.value = reason;
                form.appendChild(reasonInput);
                
                // 添加CSRF令牌（如果需要）
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                if (csrfToken) {
                    const csrfInput = document.createElement('input');
                    csrfInput.type = 'hidden';
                    csrfInput.name = '_csrf';
                    csrfInput.value = csrfToken;
                    form.appendChild(csrfInput);
                }
                
                // 添加选中的ID
                selectedIds.forEach(id => {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'ids';
                    input.value = id;
                    form.appendChild(input);
                });
                
                document.body.appendChild(form);
                form.submit();
            }
        });
    </script>
</body>
</html>
